[versions]
agp = "8.11.1"
kotlin = "2.2.21"
activity = "1.10.1"
compose-bom = "2025.06.01"
junit = "4.13.2"
serialization-json = "1.9.0"
android-test-junit = "1.2.1"
android-test-runner = "1.6.2"
zxing = "3.5.3"

[libraries]
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
junit = { module = "junit:junit", version.ref = "junit" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "android-test-junit" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android-test-runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
